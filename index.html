<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Érettségi Fókusz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <header class="topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="hamburgerMenu" class="btn-icon">☰</button>
            <div class="logo">🎓 Érettségi<span>Fókusz</span></div>
        </div>
        <div class="controls">
            <div class="zoom-controls">
                <button id="zoomOut" class="zoom-btn" title="Kicsinyítés">−</button>
                <span id="zoomLevel" class="zoom-level">100%</span>
                <button id="zoomIn" class="zoom-btn" title="Nagyítás">+</button>
            </div>

            <input type="text" id="searchInput" placeholder="🔍 Keresés fájlok között..." class="search-input">
            <span id="syncStatus" class="sync-status">Betöltés...</span>
            <button id="themeToggle" class="btn-icon">🌙</button>
        </div>
    </header>

    <div class="layout">
        <aside class="resizable-sidebar">
            <div class="sidebar-section">
                <h3 class="section-title">Tantárgyak</h3>
                <ul id="mainTabs" class="nav-menu"></ul>
            </div>
            <div class="sidebar-section">
                <h3 class="section-title">Kategóriák</h3>
                <ul id="subTabs" class="pill-menu"></ul>
            </div>
            <div class="sidebar-section">
                <h3 id="fileListTitle" class="section-title">Tételek</h3>
                <div id="fileGrid" class="file-grid"></div>
            </div>
        </aside>

        <main class="content-area">
            <div id="contentView" class="view-container">
                <div class="welcome-msg">
                    <h2>Üdvözöllek!</h2>
                    <p>Válassz egy tételt a bal oldali menüből a tanuláshoz!</p>
                </div>
            </div>
        </main>
    </div>

    <div id="quizModal" class="quiz-overlay" style="display: none;">
        <div class="quiz-card">
            <div class="quiz-header" style="display: block;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span id="quizCategory" style="color: var(--text-muted);">Kategória:</span>
                        <span id="quizTarget" style="color: var(--accent); text-transform: uppercase; font-weight: bold;">Cél</span>
                    </div>
                    <button onclick="window.appInstance.closePractice()" class="quiz-close">×</button>
                </div>
                
                <div style="margin-top: 15px; font-size: 0.9rem; font-weight: 500; display: flex; gap: 15px; align-items: center; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
                    <span>Gyakorlás forrása:</span>
                    <label style="cursor: pointer;"><input type="radio" name="quizSource" value="all" checked onchange="window.appInstance.generateQuestion()"> Minden tétel</label>
                    <label style="cursor: pointer;"><input type="radio" name="quizSource" value="fav" onchange="window.appInstance.generateQuestion()"> Csak kedvencek (⭐)</label>
                </div>
            </div>

            <div class="quiz-question">Melyik tétel tartozik a fenti kategóriába?</div>
            
            <div id="quizOptions" class="quiz-options"></div>
            <div id="quizFeedback" class="quiz-feedback"></div>
            
            <a id="verifySearchBtn" target="_blank" class="btn-verify" style="display: none;">🌐 Ellenőrzés a neten</a>

            <button id="quizNextBtn" onclick="window.appInstance.generateQuestion()" class="btn-practice" style="display: none; margin-top: 1.5rem; width: 100%; justify-content: center;">
                Következő kérdés ➔
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
